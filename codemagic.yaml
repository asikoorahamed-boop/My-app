workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Extract zip
        script: |
          unzip -o download.zip
      - name: Check files and build
        script: |
          ls -la
          cd src || true
          ls -la
    artifacts:
      - "*.apk"